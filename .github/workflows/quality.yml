name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/v0-real-data-validation

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: api-server/**/*.gradle*
      - name: Run backend tests
        working-directory: api-server
        run: ./gradlew test --no-daemon
      - name: Upload backend test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: api-server/build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --runInBand
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Record dependency audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: docker compose --env-file ops/.env.production.example -f ops/compose.production.yml config --quiet

  ocr-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build OCR worker image
        run: docker build -t trade-ops-ocr:test ocr-worker
      - name: Run OCR worker tests in its runtime image
        run: >-
          docker run --rm --entrypoint python3
          -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace
          trade-ops-ocr:test -m unittest discover -s ocr-worker/tests -v

  browser-e2e:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: api-server/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chrome for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chrome
      - name: Run browser end-to-end tests
        working-directory: frontend
        env:
          E2E_WEB_PORT: "3101"
        run: npm run test:e2e
